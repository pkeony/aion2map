<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>AION2 Map</title>

    <!-- ✅ Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      .item.active {
        background: #ffd54f;
        color: black;
        font-weight: bold;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        background: #111;
        color: white;
      }
      #app {
        display: flex;
        height: 100vh;
      }

      /* ===== 왼쪽 패널 ===== */
      #sidebar {
        width: 300px;
        background: #1b1b1b;
        padding: 15px;
        display: flex;
        flex-direction: column;
      }
      #search {
        padding: 10px;
        font-size: 15px;
        border-radius: 6px;
        border: none;
        margin-bottom: 10px;
      }

      .toggle-group {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .toggle-btn {
        flex: 1;
        padding: 8px;
        background: #333;
        border: none;
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }
      .toggle-btn.active {
        background: #0066ff;
      }

      #results {
        flex: 1;
        overflow-y: auto;
      }

      .item {
        padding: 8px;
        margin-bottom: 6px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }
      .portal {
        background: #143d73;
      }
      .region {
        background: #5a1d1d;
      }

      .star {
        cursor: pointer;
      }

      #favoritesBox {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #333;
      }
      #favoriteList .item {
        font-size: 13px;
      }

      #map {
        flex: 1;
        background: black;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <input
          id="search"
          placeholder="지역 또는 포탈 검색"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <div class="toggle-group">
          <button class="toggle-btn active" data-type="all">전체</button>
          <button class="toggle-btn" data-type="portal">포탈</button>
          <button class="toggle-btn" data-type="region">지역</button>
        </div>

        <div id="results"></div>

        <div id="favoritesBox">
          ⭐ 즐겨찾기
          <div id="favoriteList"></div>
        </div>
      </div>

      <div id="map"></div>
    </div>

      ];

      const regions = [
        { name: '이름없는 묘지', x: 324, y: 632 },
        { name: '고요한 언덕', x: 319, y: 582 },
        { name: '성소 감시초소', x: 305, y: 523 },
        { name: '트라네인 연못', x: 365, y: 538 },
        { name: '트라네인 구릉지', x: 380, y: 545 },
        { name: '드레드기온 추락지', x: 410, y: 605 },
        { name: '칼바리아 협곡', x: 431, y: 573 },
        { name: '모슬란 숲', x: 454, y: 464 },
        { name: '우르트헤임', x: 541, y: 536 },
        { name: '무닌의 다리', x: 408, y: 529 },
        { name: '정화의 숲', x: 580, y: 596 },
        { name: '격전의 언덕', x: 623, y: 663 },
        { name: '드라낙투스', x: 584, y: 712 },
        { name: '바스펠트 폐허', x: 711, y: 614 },
        { name: '그리바데 구릉지 서부', x: 659, y: 388 },
        { name: '그리바데 구릉지 남부', x: 688, y: 372 },
        { name: '이둔의 호수', x: 710, y: 387 },
        { name: '그리바데 구릉지 동부', x: 740, y: 425 },
        { name: '파프나이트 매장지', x: 676, y: 456 },
        { name: '임페투시움 광장', x: 707, y: 304 },
        { name: '검은발톱 부락', x: 627, y: 311 },
        { name: '라그타 요새', x: 509, y: 301 },
        { name: '정령의 섬', x: 790, y: 792 },
        { name: '불멸의 섬', x: 264, y: 221 },
      ];

      const allLocations = [
        ...portals.map((p) => ({ ...p, type: 'portal' })),
        ...regions.map((r) => ({ ...r, type: 'region' })),
      ];

      /* ================= 마커 ================= */
      const markers = [];
      function markerSize() {
        return 6 + map.getZoom() * 2;
      }

      allLocations.forEach((loc, i) => {
        const color = loc.type === 'portal' ? '#2aa4ff' : '#ff3b3b';
        const m = L.circleMarker([loc.y, loc.x + offsetX], {
          radius: markerSize(),
          color,
          fillColor: color,
          fillOpacity: 0.9,
        }).addTo(map);

        m.bindPopup(`<b>${loc.name}</b><br>${loc.type}`);
        m.locData = loc;
        m.locId = i;
        markers.push(m);
      });

      map.on('zoomend', () =>
        markers.forEach((m) => m.setRadius(markerSize()))
      );

      /* ================= 검색 & 즐겨찾기 ================= */
      let currentFilter = 'all';
      const searchInput = document.getElementById('search');
      const resultsDiv = document.getElementById('results');
      const favDiv = document.getElementById('favoriteList');
      let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
      let firstMatch = null;

      let selectedIndex = -1;
      let currentResults = [];

      function normalize(s) {
        return s.replace(/\s+/g, '').toLowerCase();
      }

      document.querySelectorAll('.toggle-btn').forEach((btn) => {
        btn.onclick = () => {
          document
            .querySelectorAll('.toggle-btn')
            .forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.type;
          render();
        };
      });

      function focus(loc) {
        const marker = markers.find(
          (m) => m.locId === allLocations.indexOf(loc)
        );
        if (!marker) return;
        map.flyTo(marker.getLatLng(), 2, { duration: 0.8 });
        setTimeout(() => marker.openPopup(), 300);
      }

      function toggleFav(name) {
        favorites = favorites.includes(name)
          ? favorites.filter((f) => f !== name)
          : [...favorites, name];
        localStorage.setItem('favorites', JSON.stringify(favorites));
        render();
        renderFavorites();
      }

      function render() {
        const q = normalize(searchInput.value);
        resultsDiv.innerHTML = '';
        firstMatch = null;
        selectedIndex = -1;
        currentResults = [];

        if (!q) return;

        allLocations.forEach((loc) => {
          if (
            normalize(loc.name).includes(q) &&
            (currentFilter === 'all' || loc.type === currentFilter)
          ) {
            if (!firstMatch) firstMatch = loc;
            currentResults.push(loc);

            const div = document.createElement('div');
            div.className = 'item ' + loc.type;
            div.innerHTML = `<span>${loc.name}</span><span class="star">${
              favorites.includes(loc.name) ? '★' : '☆'
            }</span>`;

            div.onclick = () => focus(loc);
            div.querySelector('.star').onclick = (e) => {
              e.stopPropagation();
              toggleFav(loc.name);
            };

            resultsDiv.appendChild(div);
          }
        });
        if (currentResults.length > 0) {
          selectedIndex = 0; // ⭐ 처음부터 첫 항목 선택
        }
        updateHighlight();
      }

      function renderFavorites() {
        favDiv.innerHTML = '';
        favorites.forEach((name) => {
          const loc = allLocations.find((l) => l.name === name);
          if (!loc) return;
          const div = document.createElement('div');
          div.className = 'item ' + loc.type;
          div.textContent = name;
          div.onclick = () => focus(loc);
          favDiv.appendChild(div);
        });
      }

      function updateHighlight() {
        const items = resultsDiv.querySelectorAll('.item');
        items.forEach((el, i) => {
          el.classList.toggle('active', i === selectedIndex);
        });
      }

      searchInput.addEventListener('input', render);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchInput.value = '';
          resultsDiv.innerHTML = '';
          selectedIndex = -1;
          currentResults = [];
          return;
        }

        if (!currentResults.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedIndex = (selectedIndex + 1) % currentResults.length;
          updateHighlight();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedIndex =
            (selectedIndex - 1 + currentResults.length) % currentResults.length;
          updateHighlight();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const target = currentResults[selectedIndex];
          if (target) focus(target);
        }
      });

      renderFavorites();

      /* ================= 지도 클릭 이름 ================= */
      map.on('click', (e) => {
        const { lat, lng } = e.latlng;
        let found = null,
          min = 15;
        allLocations.forEach((loc) => {
          const dx = loc.x + offsetX - lng;
          const dy = loc.y - lat;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < min) {
            min = d;
            found = loc;
          }
        });
        if (found) {
          L.popup()
            .setLatLng([found.y, found.x + offsetX])
            .setContent(`<b>${found.name}</b><br>${found.type}`)
            .openOn(map);
        }
      });
