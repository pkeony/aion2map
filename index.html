      /* =====================
   지도
===================== */
      const imageWidth = 1021;
      const imageHeight = 1022;

      const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 2,
      });

      const bounds = [
        [0, 0],
        [imageHeight, imageWidth],
      ];
      L.imageOverlay('aion2-map.png', bounds).addTo(map);
      map.fitBounds(bounds);

      /* =====================
   유틸
===================== */
      function normalize(str) {
        return str.replace(/\s+/g, '').toLowerCase();
      }

      function getCategory(name) {
        if (name.includes('마을')) return '마을';
        if (name.includes('야영지')) return '야영지';
        if (name.includes('절벽')) return '절벽';
        if (name.includes('유적')) return '유적';
        return '기타';
      }

      /* =====================
   즐겨찾기
===================== */
      let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

      function toggleFavorite(name) {
        if (favorites.includes(name)) {
          favorites = favorites.filter((f) => f !== name);
        } else {
          favorites.push(name);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        searchPortal();
      }

      /* =====================
   마커
===================== */
      const portalMarkers = portals.map((p) => {
        const marker = L.circleMarker([p.y, p.x], { radius: 5 }).addTo(map);
        marker.portalName = p.name;
        marker.category = getCategory(p.name);
        marker.bindPopup(p.name);
        return marker;
      });

      let activeMarker = null;

      /* =====================
   검색
===================== */
      function searchPortal() {
        const keyword = normalize(document.getElementById('searchInput').value);
        const category = document.getElementById('categoryFilter').value;
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        const matches = portalMarkers.filter((m) => {
          const matchName = normalize(m.portalName).includes(keyword);
          const matchCategory = category === 'all' || m.category === category;
          return matchName && matchCategory;
        });

        matches.forEach((m) => {
          const div = document.createElement('div');
          div.className = 'result';

          const star = favorites.includes(m.portalName) ? '⭐' : '☆';

          div.innerHTML = `
      <span>${m.portalName}</span>
      <span class="star">${star}</span>
    `;

          div.onclick = () => {
            if (activeMarker) activeMarker.setStyle({ radius: 5 });
            m.setStyle({ radius: 9 });
            activeMarker = m;
            map.setView(m.getLatLng(), 1.5);
            m.openPopup();
          };

          div.querySelector('.star').onclick = (e) => {
            e.stopPropagation();
            toggleFavorite(m.portalName);
          };

          resultsDiv.appendChild(div);
        });
      }

      /* 엔터 검색 */
      document
        .getElementById('searchInput')
        .addEventListener('keydown', (e) => {
          if (e.key === 'Enter') searchPortal();
        });
